jaffle_shop:
  target: dev
  outputs:
    prod:
      type: databricks
      host: '{{ env_var("db-host-jaffle_shop_prod") }}'
      http_path: '{{ env_var("db-httppath-jaffle_shop_prod") }}'
      token: '{{ env_var("db-token-jaffle_shop_prod") }}'
      catalog: '{{ env_var("db-catalog-jaffle_shop_prod") }}'
      schema: '{{ env_var("db-schema-jaffle_shop_prod") }}'
      threads: 4
    dev:
      type: duckdb
      path: /Users/Shared/academy/agentic/projects/jaffle_shop/jaffle_shop.duckdb
      schema: main
      threads: 4
